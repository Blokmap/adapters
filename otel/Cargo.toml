[package]
name = "otel"
version = "0.1.0"
edition = "2024"

[features]
default = ["middleware", "metrics"]

middleware = [
	"axum-metrics",
	"dep:axum",
	"dep:http-body",
	"dep:tower",
	"dep:tracing",
	"dep:pin-project",
	"dep:bytes",
]

metrics = ["axum-metrics", "database-metrics", "host-metrics", "tokio-metrics"]

axum-metrics = []
database-metrics = ["dep:deadpool-diesel"]
host-metrics = ["dep:sysinfo"]
tokio-metrics = ["dep:tokio"]

[dependencies]
deadpool-diesel = { version = "0.7.0", optional = true, features = [
	"postgres",
] }
sysinfo = { version = "0.40.4", optional = true }
tokio = { version = "1.54.1", optional = true }
axum = { version = "0.8.9", optional = true }
http-body = { version = "1.1.0", optional = true }
tower = { version = "0.5.3", optional = true }
tracing = { version = "0.1.44", optional = true }
pin-project = { version = "1.2.0", optional = true }
bytes = { version = "1.12.2", optional = true }

opentelemetry = "0.33.1"
opentelemetry-appender-tracing = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", features = ["grpc-tonic"] }
opentelemetry_sdk = "0.33.1"
opentelemetry-semantic-conventions = { version = "0.33.1", features = [
	"semconv_experimental",
] }
reqwest = "0.13.5"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
