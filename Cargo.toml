[package]
name = "blokmap_auth"
version = "0.1.0"
edition = "2024"

[features]
default = ["authorization", "jwks"]
client = ["dep:arc-swap", "dep:reqwest", "dep:tokio"]
authorization = ["client"]
jwks = ["dep:arc-swap", "dep:reqwest", "dep:tokio"]

[dependencies]
arc-swap = { version = "1.9.5", optional = true }
axum = { version = "0.8.9", default-features = false, features = ["json"] }
axum-extra = { version = "0.12.6", default-features = false, features = ["cookie"] }
bitflags = "2.13.2"
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto", "use_pem"] }
reqwest = { version = "0.13.5", optional = true, features = ["form", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_plain = "1.0.2"
thiserror = "2.0.21"
tower = { version = "0.5.3", default-features = false }
tokio = { version = "1.54.1", optional = true, features = ["sync", "time"] }
url = "2.5.9"
uuid = { version = "1.23.1", features = ["serde"] }

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
serde_json = "1.0.154"
tower = { version = "0.5.3", features = ["util"] }
tokio = { version = "1.54.1", features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "test-util",
    "time",
] }

[[example]]
name = "service"
required-features = ["authorization", "jwks"]

[[example]]
name = "server"
